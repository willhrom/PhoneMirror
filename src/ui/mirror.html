<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone Mirror</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#e9ecf3;-webkit-user-select:none;user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:default;object-fit:contain}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;background:#0b0d12;text-align:center}
  .overlay.hidden{display:none}
  .box{max-width:280px}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid #2a3350;border-top-color:#4f8cff;animation:r .8s linear infinite;margin:0 auto 14px}
  @keyframes r{to{transform:rotate(360deg)}}
  h3{margin:0 0 6px;font-size:17px;font-weight:600}
  p{margin:0 0 14px;color:#8a93a8;font-size:13px}
  input{width:150px;font:600 26px/1 "Segoe UI",sans-serif;letter-spacing:10px;text-align:center;padding:10px 8px 10px 18px;border-radius:12px;border:1px solid #2d3344;background:#11141b;color:#fff;outline:none;-webkit-user-select:text;user-select:text}
  input:focus{border-color:#4f8cff;box-shadow:0 0 0 3px #4f8cff2a}
  button{margin-top:14px;border:0;border-radius:11px;padding:10px 22px;font:600 14px "Segoe UI",sans-serif;color:#fff;background:linear-gradient(135deg,#4f8cff,#7c5cff);cursor:pointer}
  .err{color:#fca5a5;font-size:12.5px;min-height:18px;margin-top:8px}
  .toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#161a23ee;border:1px solid #2d3344;border-radius:12px;padding:8px 14px;font-size:12.5px;max-width:85%;text-align:center;transition:opacity .3s}
  .toast.hidden{opacity:0;pointer-events:none}
  .stats{position:absolute;left:8px;top:8px;background:#000a;color:#9ff0cf;font:12px/1.4 Consolas,monospace;padding:4px 8px;border-radius:6px;pointer-events:none;white-space:pre}
  .stats.hidden{display:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div class="overlay" id="wait"><div class="box"><div class="spin"></div><h3 id="waitTitle">Connecting…</h3><p id="waitText"></p></div></div>

<div class="overlay hidden" id="codeBox"><div class="box">
  <h3>Enter the pairing code</h3>
  <p>It's shown in the Phone Mirror app on your phone. You only need to do this once.</p>
  <input id="code" maxlength="4" inputmode="numeric" autocomplete="off">
  <div class="err" id="codeErr"></div>
  <button id="codeGo">Connect</button>
</div></div>

<div class="toast hidden" id="toast"></div>
<div class="stats hidden" id="stats"></div>

<script>
const P = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
const host = window.chrome && window.chrome.webview;
const tell = m => { try { host && host.postMessage(m); } catch (e) {} };
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

// Decoder delay tracking: if the PC's hardware decoder holds frames back, switch to software decoding.
let hwMode = 'prefer-hardware', decSamples = [], decAvg = 0, switched = false, rtt = 0, phoneQueue = 0;
const sentAt = new Map();
function noteDecode(ms){
  decSamples.push(ms);
  if (decSamples.length > 60) decSamples.shift();
  decAvg = decSamples.reduce((a, b) => a + b, 0) / decSamples.length;
  if (!switched && hwMode === 'prefer-hardware' && decSamples.length >= 60 && decAvg > 40) {
    switched = true;
    hwMode = 'prefer-software';
    setup(vw, vh);
    send({ t:'sync' });
  }
}
let ws, decoder = null, cfg = null, needKey = true, vw = 0, vh = 0, control = true, closedByUs = false;
let pendingFrame = null, drawQueued = false;

function show(id){ ['wait','codeBox'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
function waiting(title, text){ $('waitTitle').textContent = title; $('waitText').textContent = text || ''; show('wait'); }
let toastTimer;
function toast(t, ms){ const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), ms || 4000); }

function send(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function connect(code){
  waiting('Connecting…', P.name ? 'to ' + P.name : '');
  ws = new WebSocket(P.url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => send({ t:'hello', pcId:P.pcId, pcName:P.pcName, code: code || '', maxSize:P.maxSize, bitrate:P.bitrate, fps:P.fps, audio:!!P.audio, direct:P.direct || null });
  ws.onmessage = e => typeof e.data === 'string' ? onText(JSON.parse(e.data)) : onVideo(e.data);
  ws.onclose = () => { if (!closedByUs) tell({ type:'closed' }); };
  ws.onerror = () => tell({ type:'error', text:'Couldn’t reach the phone. Is Phone Mirror running on it, on the same Wi-Fi?' });
}

function onText(m){
  switch (m.t) {
    case 'needCode': show('codeBox'); tell({ type:'needCode' }); setTimeout(() => $('code').focus(), 50); break;
    case 'badCode': show('codeBox'); $('codeErr').textContent = 'That code didn’t match. Check the phone and try again.'; $('code').select(); break;
    case 'ok':
      control = !!m.control;
      if (!m.sharing) waiting('Tap “Share screen” on your phone', 'Android asks each time. Then tap Start.');
      if (!control) toast('Watching only. To use your mouse and keyboard, turn on control in the Phone Mirror app.', 7000);
      tell({ type:'ok', name:m.name });
      break;
    case 'config': setup(m.w, m.h); break;
    case 'control': control = !!m.enabled; if (!control) toast('Control is off. Turn it on in the Phone Mirror app on your phone.', 6000); break;
    case 'error': toast(m.text, 8000); tell({ type:'error', text:m.text }); break;
    case 'pong': rtt = performance.now() - m.ts; phoneQueue = m.q || 0; break;
  }
}

function setup(w, h){
  vw = w; vh = h;
  canvas.width = w; canvas.height = h;
  if (decoder) { try { decoder.close(); } catch (e) {} }
  decoder = new VideoDecoder({
    output: frame => {
      const t0 = sentAt.get(frame.timestamp);
      if (t0 !== undefined) { sentAt.delete(frame.timestamp); noteDecode(performance.now() - t0); }
      // Draw the moment it's decoded (the canvas is low-latency) instead of waiting for the next refresh.
      ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
      frame.close();
      stats.frames++;
      if (!$('wait').classList.contains('hidden')) show(null);
    },
    error: () => { needKey = true; send({ t:'sync' }); setup(vw, vh); }
  });
  decoder.configure({ codec:'avc1.42E02A', optimizeForLatency:true, hardwareAcceleration: hwMode });
  sentAt.clear(); decSamples = [];
  needKey = true;
  tell({ type:'size', w, h });
}

// Rewrites an H.264 SPS so decoders know frames come out in decode order
// (VUI bitstream_restriction: max_num_reorder_frames = 0). Returns the original on any doubt.
function lowLatencySps(nal) {            // nal: Uint8Array starting with the NAL header byte (type 7)
  try {
    const rbsp = [];
    let z = 0;
    for (let i = 1; i < nal.length; i++) {
      if (z >= 2 && nal[i] === 3) { z = 0; continue; }   // emulation-prevention byte
      rbsp.push(nal[i]);
      z = nal[i] === 0 ? z + 1 : 0;
    }
    let pos = 0;
    const bit = () => { const b = (rbsp[pos >> 3] >> (7 - (pos & 7))) & 1; pos++; if (pos > rbsp.length * 8) throw 0; return b; };
    const bits = n => { let v = 0; for (let i = 0; i < n; i++) v = v * 2 + bit(); return v; };
    const ue = () => { let z = 0; while (!bit()) { if (++z > 31) throw 0; } return z ? (2 ** z - 1 + bits(z)) : 0; };
    const se = () => { const k = ue(); return k & 1 ? (k + 1) / 2 : -k / 2; };
    const scaling = n => { let last = 8, next = 8; for (let j = 0; j < n; j++) { if (next) { next = (last + se() + 256) % 256; } last = next || last; } };

    const profile = bits(8); bits(8); bits(8); ue();
    if ([100,110,122,244,44,83,86,118,128,138,139,134,135].includes(profile)) {
      const chroma = ue(); if (chroma === 3) bit();
      ue(); ue(); bit();
      if (bit()) for (let i = 0; i < (chroma === 3 ? 12 : 8); i++) if (bit()) scaling(i < 6 ? 16 : 64);
    }
    ue();                                   // log2_max_frame_num
    const poc = ue();
    if (poc === 0) ue();
    else if (poc === 1) { bit(); se(); se(); const n = ue(); for (let i = 0; i < n; i++) se(); }
    const refs = ue(); bit(); ue(); ue();
    if (!bit()) bit();                      // frame_mbs_only / mb_adaptive
    bit();                                  // direct_8x8
    if (bit()) { ue(); ue(); ue(); ue(); }  // cropping
    const vuiFlagPos = pos;
    let copyUpTo;                           // bits copied verbatim before our bitstream_restriction flag
    let writeVuiFlag = false;
    if (!bit()) { copyUpTo = vuiFlagPos; writeVuiFlag = true; }
    else {
      if (bit()) { if (bits(8) === 255) { bits(16); bits(16); } }
      if (bit()) bit();
      if (bit()) { bits(3); bit(); if (bit()) { bits(8); bits(8); bits(8); } }
      if (bit()) { ue(); ue(); }
      if (bit()) { bits(32); bits(32); bit(); }
      if (bit() || bit()) return nal;       // HRD parameters: leave alone
      bit();                                // pic_struct_present
      copyUpTo = pos;                       // position of bitstream_restriction_flag
    }

    const out = [];
    let acc = 0, n = 0;
    const put = b => { acc = acc * 2 + b; if (++n === 8) { out.push(acc); acc = 0; n = 0; } };
    const putBits = (v, k) => { for (let i = k - 1; i >= 0; i--) put(Math.floor(v / 2 ** i) & 1); };
    const putUe = v => { const x = v + 1, len = Math.floor(Math.log2(x)); putBits(0, len); putBits(x, len + 1); };
    for (let i = 0; i < copyUpTo; i++) put((rbsp[i >> 3] >> (7 - (i & 7))) & 1);
    if (writeVuiFlag) {
      put(1);                               // vui_parameters_present
      // no aspect ratio, overscan, video signal, chroma location, timing, NAL HRD, VCL HRD, pic_struct
      for (let i = 0; i < 8; i++) put(0);
    }
    put(1);                                 // bitstream_restriction_flag
    put(1);                                 // motion_vectors_over_pic_boundaries
    putUe(2); putUe(1); putUe(16); putUe(16);
    putUe(0);                               // max_num_reorder_frames = 0  <- the point of all this
    putUe(Math.max(1, refs));               // max_dec_frame_buffering
    put(1); while (n) put(0);               // rbsp trailing bits

    const res = [nal[0]];
    let zeros = 0;
    for (const b of out) {
      if (zeros >= 2 && b <= 3) { res.push(3); zeros = 0; }
      res.push(b);
      zeros = b === 0 ? zeros + 1 : 0;
    }
    return new Uint8Array(res);
  } catch (e) { return nal; }
}

// Applies it to an Annex-B buffer (start codes + NALs), returning a new buffer.
function patchConfig(buf) {
  const starts = [];
  for (let i = 0; i + 3 < buf.length; i++) {
    if (buf[i] === 0 && buf[i+1] === 0 && (buf[i+2] === 1 || (buf[i+2] === 0 && buf[i+3] === 1))) {
      const len = buf[i+2] === 1 ? 3 : 4;
      starts.push([i, i + len]);
      i += len - 1;
    }
  }
  if (!starts.length) return buf;
  const parts = [];
  for (let k = 0; k < starts.length; k++) {
    const [s, d] = starts[k];
    const end = k + 1 < starts.length ? starts[k+1][0] : buf.length;
    let nal = buf.subarray(d, end);
    if ((nal[0] & 0x1f) === 7) nal = lowLatencySps(nal);
    parts.push(new Uint8Array([0, 0, 0, 1]), nal);
  }
  const total = parts.reduce((a, p) => a + p.length, 0);
  const out = new Uint8Array(total);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}


// ---------- audio: 48 kHz stereo PCM, played with a small (~60 ms) buffer ----------
let actx = null, nextT = 0;
function playPcm(bytes){
  if (!P.audio) return;
  if (!actx) actx = new AudioContext({ sampleRate:48000, latencyHint:'interactive' });
  if (actx.state === 'suspended') actx.resume();
  const i16 = new Int16Array(bytes), n = i16.length >> 1;
  if (!n) return;
  const ab = actx.createBuffer(2, n, 48000), L = ab.getChannelData(0), R = ab.getChannelData(1);
  for (let i = 0; i < n; i++) { L[i] = i16[2*i] / 32768; R[i] = i16[2*i+1] / 32768; }
  const src = actx.createBufferSource();
  src.buffer = ab;
  src.connect(actx.destination);
  const now = actx.currentTime;
  if (nextT < now + 0.02 || nextT > now + 0.25) nextT = now + 0.06;   // resync if we drift
  src.start(nextT);
  nextT += ab.duration;
}

function onVideo(buf){
  const flags0 = new DataView(buf).getUint8(0);
  if (flags0 & 4) { playPcm(buf.slice(9)); return; }
  if (!decoder || decoder.state !== 'configured') return;
  stats.bytes += buf.byteLength;
  const dv = new DataView(buf);
  const flags = dv.getUint8(0);
  const pts = Number(dv.getBigUint64(1));
  const data = new Uint8Array(buf, 9);
  if (flags & 2) { cfg = patchConfig(data.slice()); return; }   // tell the decoder: show frames right away
  const key = (flags & 1) !== 0;
  if (needKey && !key) return;
  if (!key && decoder.decodeQueueSize > 8) { needKey = true; send({ t:'sync' }); return; }   // badly behind: skip ahead
  let payload = data;
  if (key && cfg) { payload = new Uint8Array(cfg.length + data.length); payload.set(cfg, 0); payload.set(data, cfg.length); }
  needKey = false;
  sentAt.set(pts, performance.now());
  if (sentAt.size > 120) sentAt.delete(sentAt.keys().next().value);
  try { decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: pts, data: payload })); }
  catch (e) { needKey = true; send({ t:'sync' }); }
}

// ---------- input ----------
function pos(e){
  // The picture keeps its shape inside the window (black bars if the window is a different shape).
  const r = canvas.getBoundingClientRect();
  let left = r.left, top = r.top, w = r.width, h = r.height;
  if (vw && vh) {
    const s = Math.min(r.width / vw, r.height / vh);
    w = vw * s; h = vh * s;
    left = r.left + (r.width - w) / 2; top = r.top + (r.height - h) / 2;
  }
  return { x: Math.min(1, Math.max(0, (e.clientX - left) / w)), y: Math.min(1, Math.max(0, (e.clientY - top) / h)) };
}
let down = false, lastMove = 0, moveTimer = null, lastPos = null;
canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  if (e.button === 2) { send({ t:'key', k:'back' }); e.preventDefault(); return; }
  if (e.button === 1) { send({ t:'key', k:'home' }); e.preventDefault(); return; }
  if (e.button !== 0) return;
  canvas.setPointerCapture(e.pointerId);
  down = true;
  send(Object.assign({ t:'down' }, pos(e)));
});
canvas.addEventListener('pointermove', e => {
  if (!down) return;
  lastPos = pos(e);
  const now = performance.now();
  if (now - lastMove >= 16) { lastMove = now; send(Object.assign({ t:'move' }, lastPos)); }
  else if (!moveTimer) moveTimer = setTimeout(() => { moveTimer = null; if (down && lastPos) { lastMove = performance.now(); send(Object.assign({ t:'move' }, lastPos)); } }, 16);
});
const release = e => {
  if (!down) return;
  down = false;
  if (moveTimer) { clearTimeout(moveTimer); moveTimer = null; }
  send(Object.assign({ t:'move' }, pos(e)));
  send({ t:'up' });
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('auxclick', e => e.preventDefault());

// Mouse wheel / two-finger touchpad scrolling = one continuous finger drag on the phone
// (separate quick swipes looked like long presses and selected text).
let wheel = null, wheelEnd = null, wheelSent = 0;
function wheelFinish(){
  if (!wheel) return;
  send({ t:'move', x: wheel.x, y: wheel.y });
  send({ t:'up' });
  wheel = null;
}
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (down) return;
  const r = canvas.getBoundingClientRect();
  const h = vw && vh ? Math.min(r.width / vw, r.height / vh) * vh : r.height;
  let dy = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
  dy = -dy / h;                       // move the "finger" as far as the content should move
  if (!wheel) {
    const p = pos(e);
    // start where there's room to move in the scroll direction
    const startY = dy < 0 ? Math.max(p.y, 0.55) : Math.min(p.y, 0.45);
    wheel = { x: p.x, y: startY, startY };
    send({ t:'down', x: wheel.x, y: wheel.y });
    send({ t:'move', x: wheel.x, y: wheel.y + (dy < 0 ? -0.02 : 0.02) });  // moves at once: never a long press
    wheel.y += dy < 0 ? -0.02 : 0.02;
  }
  wheel.y += dy;
  if (wheel.y < 0.03 || wheel.y > 0.97) {
    // reached the edge of the screen: lift and put the finger back for more scrolling
    wheel.y = Math.min(0.97, Math.max(0.03, wheel.y));
    const x = wheel.x, sy = wheel.startY;
    wheelFinish();
    wheel = { x, y: sy, startY: sy };
    send({ t:'down', x, y: sy });
  }
  const now = performance.now();
  if (now - wheelSent >= 16) { wheelSent = now; send({ t:'move', x: wheel.x, y: wheel.y }); }
  clearTimeout(wheelEnd);
  wheelEnd = setTimeout(wheelFinish, 120);
}, { passive:false });

canvas.addEventListener('keydown', e => {
  if (e.key === 'F2') { $('stats').classList.toggle('hidden'); e.preventDefault(); return; }
  if (e.ctrlKey && (e.key === 'v' || e.key === 'V')) {
    e.preventDefault();
    navigator.clipboard.readText().then(t => t && send({ t:'text', s:t })).catch(() => {});
    return;
  }
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Backspace') { send({ t:'key', k:'del' }); e.preventDefault(); return; }
  if (e.key === 'Enter') { send({ t:'key', k:'enter' }); e.preventDefault(); return; }
  if (e.key === 'Escape') { send({ t:'key', k:'back' }); e.preventDefault(); return; }
  if (e.key.length === 1) { send({ t:'text', s:e.key }); e.preventDefault(); }
});

// ---------- code entry ----------
$('codeGo').onclick = () => {
  const v = $('code').value.trim();
  if (!/^\d{4}$/.test(v)) { $('codeErr').textContent = 'Enter the 4 digits shown on your phone.'; return; }
  $('codeErr').textContent = '';
  send({ t:'hello', pcId:P.pcId, pcName:P.pcName, code:v, maxSize:P.maxSize, bitrate:P.bitrate, fps:P.fps, audio:!!P.audio, direct:P.direct || null });
  waiting('Connecting…', '');
};
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('codeGo').click(); });

// ---------- keep the phone's Wi-Fi awake ----------
// Phones nap their Wi-Fi between packets (power saving), which delays everything we send them.
// A tiny tick every 20 ms keeps it awake while mirroring.
setInterval(() => { if (ws && ws.readyState === 1 && ws.bufferedAmount < 4096) ws.send('{"t":"k"}'); }, 20);

// ---------- stats (F2) ----------
const stats = { frames: 0, bytes: 0 };
setInterval(() => {
  const el = $('stats');
  if (!el.classList.contains('hidden'))
    el.textContent = `${stats.frames} fps · ${(stats.bytes * 8 / 1e6).toFixed(1)} Mbps · ${vw}×${vh}\n` +
      `network ${Math.round(rtt)} ms round trip · phone queue ${phoneQueue} ms · decode ${Math.round(decAvg)} ms (${hwMode === 'prefer-hardware' ? 'hw' : 'sw'})`;
  send({ t:'ping', ts: performance.now() });
  stats.frames = 0; stats.bytes = 0;
}, 1000);

// ---------- called by the app ----------
window.pm = {
  key: k => send({ t:'key', k }),
  quality: (maxSize, bitrate) => send({ t:'quality', maxSize, bitrate }),
  shot: () => vw ? canvas.toDataURL('image/png') : '',
  close: () => { closedByUs = true; try { ws.close(); } catch (e) {} },
};

if (!('VideoDecoder' in window)) {
  waiting('This PC can’t play the phone’s video', 'Update Microsoft Edge WebView2 and try again.');
  tell({ type:'error', text:'WebCodecs not available' });
} else connect('');
</script>
</body>
</html>
